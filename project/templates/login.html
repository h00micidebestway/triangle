{% extends "base.html" %}
{% block title %}Вход{% endblock %}
{% block content %}
<div class="form-page">
  <div class="form-card">
    <h2>Вход в аккаунт</h2>
    <form method="post">
      <div class="form-group">
        <label>Email</label>
        <input type="email" name="email" required placeholder="you@example.com" autofocus>
      </div>
      <div class="form-group">
        <label>Пароль</label>
        <input type="password" name="password" required placeholder="••••••••">
      </div>
      <button type="submit" class="btn btn-primary btn-block" style="margin-top:6px;">Войти</button>
    </form>
    <p class="form-link">Нет аккаунта? <a href="{{ url_for('register') }}">Зарегистрироваться</a></p>
  </div>
</div>
{% endblock %}
