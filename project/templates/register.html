{% extends "base.html" %}
{% block title %}Регистрация{% endblock %}
{% block content %}
<div class="form-page">
  <div class="form-card">
    <h2>Создать аккаунт</h2>
    <form method="post">
      <div class="form-group">
        <label>Имя</label>
        <input type="text" name="name" required placeholder="Иван Иванов" autofocus>
      </div>
      <div class="form-group">
        <label>Email</label>
        <input type="email" name="email" required placeholder="you@example.com">
      </div>
      <div class="form-group">
        <label>Телефон (необязательно)</label>
        <input type="tel" name="phone" placeholder="+7 (999) 000-00-00">
      </div>
      <div class="form-group">
        <label>Пароль (не менее 6 символов)</label>
        <input type="password" name="password" required placeholder="••••••••" minlength="6">
      </div>
      <button type="submit" class="btn btn-primary btn-block" style="margin-top:6px;">Зарегистрироваться</button>
    </form>
    <p class="form-link">Уже есть аккаунт? <a href="{{ url_for('login') }}">Войти</a></p>
  </div>
</div>
{% endblock %}
